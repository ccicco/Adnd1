name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  monster-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev pkg-config g++
      - name: Build and run monster registry integration test
        run: scripts/test_monster_registry.sh
      - name: Test monster validator
        run: scripts/test_validate_monsters.sh
      - name: Validate monster dataset
        run: lua5.4 scripts/validate_monsters.lua monsters/monsters/*.lua
