name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  monster-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Test monster validator
        run: scripts/test_validate_monsters.sh
      - name: Validate monster dataset
        run: |
          files=(monsters/monsters/*.lua)
          if [ "${files[0]}" = "monsters/monsters/*.lua" ]; then
            echo "No monster Lua files found under monsters/monsters/" >&2
            exit 1
          fi
          lua5.4 scripts/validate_monsters.lua "${files[@]}"
